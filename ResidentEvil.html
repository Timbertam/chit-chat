<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="ResidentEvil.css"><link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="HoveringPicsAhuhuhuy.js" type="text/javascript"></script>
  <!-- IMPORTANT! AUTOPAUSER ;D -->
  <script>
  document.addEventListener('play', function (event) {
    const allAudios = document.querySelectorAll('audio');
    
    allAudios.forEach(function (audio) {
      if (audio !== event.target) {
        audio.pause();
      }
    });
  }, true);
</script>
<table>
  <!-- START OF THIS TABLE -->
  <tr>
    <th>Name</th>
    <th>Background & Variants</th>
    <th>Audio Track</th>
    <th>Origin</th>
  </tr>
  <!-- START OF THIS CHIT-CHAT ENTRY -->
  <tr>
    <td>serenity</td>
    <td>
      <button
        id="imageLarge"
        onmouseover="showImage(this,'Textures/Assets/120px-Skies_SKY6.png')"
        onmouseout="hideImage(this)"
        data-text="serenity"
        onclick="navigator.clipboard.writeText(this.dataset.text); new Audio('SFX/sfx_dssele.ogg').play(); let old=this.innerText; this.innerText='COPIED! ;D'; setTimeout(() => this.innerText=old, 1000)">
        [D]
      </button></td>
    <td><audio controls>
  <source src="Music/O_SERENI.mp3" type="audio/ogg">
</audio></td>
    <td>RE4 - Serenity</td>
  </tr>
  <!-- START OF THIS CHIT-CHAT ENTRY -->
  <tr>
    <td>saferoom</td>
    <td>
      <button
        id="imageLarge"
        onmouseover="showImage(this,'Textures/Assets/240px-SKY64.png')"
        onmouseout="hideImage(this)"
        data-text="saferoom"
        onclick="navigator.clipboard.writeText(this.dataset.text); new Audio('SFX/sfx_dssele.ogg').play(); let old=this.innerText; this.innerText='COPIED! ;D'; setTimeout(() => this.innerText=old, 1000)">
        [D]
      </button></td>
    <td><audio controls>
  <source src="Music/O_SAFERO.mp3" type="audio/ogg">
</audio></td>
    <td>RE7 - Saferoom</td>
  </tr>
</table>
